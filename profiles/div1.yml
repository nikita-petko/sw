servers:
  discovery_port: 55000

profiles:
  - name: "RPM"
    key: x
    mode: toggle
    disables: "*"
    delay_mode: from_timestamp
    filter: "(tcp.SrcPort == 55000 or tcp.DstPort == 55000)"
    delay_ms: 500
    windivert_options:
      forward: true

  - name: "Long (Recv)"
    keys:
      - ctrl
      - space
    key_mode: oneof
    mode: toggle
    disables: 
      - "RPM"
    filter: "tcp.Psh and tcp.PayloadLength > 0 and tcp.SrcPort == 55000"
    retransmission_mode: none
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: source
      
  - name: "Long (Send)"
    keys:
      - alt
      - space
    key_mode: oneof
    mode: toggle
    retransmission_mode: none
    disables: 
      - "RPM"
    filter: "tcp.Psh and tcp.PayloadLength > 0 and tcp.DstPort == 55000"
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: destination
