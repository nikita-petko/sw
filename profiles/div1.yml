servers:
  discovery_port: 55000
  addresses:
    # Matchmaking and voice servers (EU West - Brussels)
    - "104.155.45.25:BRU-EUC-25"
    - "34.76.248.132:BRU-EUC-132"

  EU:
    # Game servers (Netherlands - Groningen)
    - "34.13.202.203:GR-EUC-203"
    - "34.90.202.108:GR-EUC-108"

  ASIA:
    # Asia Servers (Tokyo)
    - "136.110.106.37:13-ASE-37"
    - "34.104.143.167:13-ASE-167"

  US:
    # US Servers (Iowa)
    - "136.112.189.19:IA-USC-19"
    - "35.232.75.10:IA-USC-10"

  OCEANIA:
    # Oceania Servers (Sydney)
    - "34.116.109.80:NSW-OCE-80"
    - "34.151.127.98:NSW-OCE-98"

features:
  region_enforcement:
    enabled: true
    probe_port: 55002

profiles:
  - name: "RPM"
    key: x
    mode: toggle
    disables: "*"
    delay_mode: from_timestamp
    filter: "(tcp.SrcPort == 55000 or tcp.DstPort == 55000)"
    delay_ms: 500
    windivert_options:
      forward: true
      client_address_enforcement: both

  - name: "Test"
    keys:
      - d
    key_mode: oneof
    mode: toggle
    disables: 
      - "*"
    filter: "tcp.Psh and tcp.PayloadLength > 500 and tcp.SrcPort == 55000"
    retransmission_mode: none
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: source
      client_address_enforcement: destination


  - name: "Long (Recv)"
    keys:
      - z
      - space
    key_mode: oneof
    mode: toggle
    disables: 
      - "RPM"
    filter: "tcp.Psh and tcp.PayloadLength > 0 and tcp.SrcPort == 55000"
    retransmission_mode: none
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: source
      client_address_enforcement: destination
      
  - name: "Long (Send - with delay)"
    keys:
      - alt
      - space
    key_mode: oneof
    mode: toggle
    retransmission_mode: none
    disables: 
      - "RPM"
      - "Long (Send)"
    filter: "tcp.Psh and tcp.PayloadLength > 0 and tcp.DstPort == 55000"
    delay_mode: ratio
    disable_wait_percent: 15
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: destination
      client_address_enforcement: source

  - name: "Long (Send)"
    keys:
      - ctrl
      - space
    key_mode: oneof
    mode: toggle
    retransmission_mode: none
    disables: 
      - "RPM"
      - "Long (Send - with delay)"
    respect_disable_wait: false
    filter: "tcp.Psh and tcp.PayloadLength > 0 and tcp.DstPort == 55000"
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: destination
      client_address_enforcement: source