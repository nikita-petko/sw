servers:
  discovery_port: 55000
  addresses:
    # Matchmaking and voice servers (EU West - Brussels)
    - "104.155.45.25:BRU-EUC-25"
    - "34.76.248.132:BRU-EUC-132"

  # Game Server Regions

  # Netherlands (Groningen)
  EU:
    - "34.13.202.203:GR-EUC-203"
    - "34.90.202.108:GR-EUC-108"

  # Asia (Tokyo)
  ASIA:
    - "136.110.106.37:13-ASE-37"
    - "34.104.143.167:13-ASE-167"

  # US (Iowa)
  US:
    - "136.112.189.19:IA-USC-19"
    - "35.232.75.10:IA-USC-10"

  # Oceania (Sydney)
  OCEANIA:
    - "34.116.109.80:NSW-OCE-80"
    - "34.151.127.98:NSW-OCE-98"

features:
  desync_countdown:
    enabled: true
    display: override
    enabled_for:
      - "Long (Send - Instant Release)"
      - "Long (Send - Release Delay)"

  forwarded_address_discovery:
    enabled: false
    port: 55000
    interval: 5000
    inbound: 5 # Ethernet interface index (Xbox)
    outbound: 67 # OpenVPN interface index

profiles:
  # Trickle profile: introduces a small delay to packets
  # to let a little bit of network traffic through without significant delay
  #
  # See research/division1_rpm_exploit_variants.md for more details on why this profile is configured this way.
  - name: "Trickle"
    key: x
    mode: toggle
    disables: "*"
    delay_mode: from_timestamp
    filter: "tcp.SrcPort == 55000 or tcp.DstPort == 55000"
    delay_ms: 500
    windivert_options:
      forward: true
      client_address_enforcement: both

  # Long (Recv) profile: Defers incoming packets to introduce a delay without affecting outgoing traffic.
  # When used in The Division 1 game, this will cause all server updates to freeze for the duration of the delay.
  # However you will still move and update normally for others on their screen (what you are doing on your screen is what will be seen)
  #
  # See research/division1_lag_switch_weapon_swap_analysis.md for more details.
  - name: "Long (Recv)"
    keys:
      - z
      - space
    key_mode: oneof
    mode: toggle
    disables: 
      - "Trickle"
    filter: "tcp.Psh and tcp.SrcPort == 55000"
    retransmission_mode: none
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: source
      client_address_enforcement: destination

  # Long (Send - Instant Release) profile: Defers outgoing packets but allows for immediate release using the configured key.
  # When used in The Division 1 game, this will cause all client updates to freeze for the duration of the delay.
  # However, you can immediately release outgoing packets using the configured key.
  #
  # See research/division1_lag_switch_weapon_swap_analysis.md and research/division1_desync_duration_vs_lag_duration.md for more details.
  - name: "Long (Send - Instant Release)"
    keys:
      - ctrl
    key_mode: oneof
    mode: toggle
    retransmission_mode: none
    ack_restoration: false
    disables: 
      - "Trickle"
      - "Long (Send - Release Delay)"
    respect_disable_wait: false
    filter: "tcp.Psh and tcp.DstPort == 55000"
    delay_mode: ratio
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: destination
      client_address_enforcement: source

  # Long (Send - Release Delay) profile: Same as the "Long (Send - Instant Release)" profile but introduces a delay before releasing outgoing packets.
  # 
  # The reasoning and rationale behind the disable wait percentage on this is described in research/division1_lag_switch_weapon_swap_analysis.md.
  - name: "Long (Send - Release Delay)"
    keys:
      - alt
      - space
    key_mode: oneof
    mode: toggle
    retransmission_mode: none
    disables: 
      - "Trickle"
      - "Long (Send - Instant Release)"
    filter: "tcp.Psh and tcp.DstPort == 55000"
    delay_mode: ratio
    disable_wait_percent: 15
    ratio: 10%
    delay_ms: 18000
    windivert_options:
      forward: true
      server_direction: destination
      client_address_enforcement: source

  # Force TP profile: Forces teleportation of desynced player character in The Division 1 game.
  # It triggers a forced teleportation of the player's character by manipulating the network packets.
  # This profile essentially is a macro that automates the process of forcing a teleportation by
  # holding inbound for 3 seconds. This number isn't a true guide for what to use to force a teleportation;
  # as in the end it is directly proportional to how long the other player has been desynced, but 3 seconds
  # will usually suffice for typical desync durations of around 20-30s.
  #
  # See research/division1_lag_switch_weapon_swap_analysis.md and research/division1_desync_duration_vs_lag_duration.md for more details.
  - name: "Force TP"
    keys:
      - c
    key_mode: oneof
    mode: period
    activation_period: 3000
    filter: "tcp.Psh and tcp.SrcPort == 55000"
    retransmission_mode: none
    delay_mode: from_timestamp
    delay_ms: 0
    windivert_options:
      forward: true
      server_direction: source
      client_address_enforcement: destination
